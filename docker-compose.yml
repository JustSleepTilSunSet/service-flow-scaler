services:
  app:
    build: .
    env_file: ".env"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "8888:3001"
    volumes:
      - ${PWD}:/app
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PWD}/deployment/prometheus.yaml:/etc/prometheus/prometheus.yml:ro